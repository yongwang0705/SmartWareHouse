server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: order-service
              uri: http://order-service:8081
              predicates:
                - Path=/api/orders/**

            - id: inventory-service
              uri: http://inventory-service:8082
              predicates:
                - Path=/api/inventory/**