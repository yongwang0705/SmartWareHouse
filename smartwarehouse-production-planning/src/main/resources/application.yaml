server:
  port: 8083

spring:
  application:
    name: smartwarehouse-production-planning
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/production_db}
    username: ${DB_USERNAME:scm_user}
    password: ${DB_PASSWORD:scm_password}

  sql:
    init:
      mode: always

  # PPS is a gRPC client only: it calls Order Service and Inventory Service.
  grpc:
    client:
      channel:
        order-service:
          target: ${ORDER_GRPC_TARGET:static://order-service:9090}
        inventory-service:
          target: ${INVENTORY_GRPC_TARGET:static://inventory-service:9090}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
