server:
  port: 8081

spring:
  application:
    name: smartwarehouse-order-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: always

  grpc:
    server:
      port: 9090
    client:
      channel:
        inventory:
          target: static://inventory-service:9090
#          target: static://localhost:9090